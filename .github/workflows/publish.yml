name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: consequent
          POSTGRES_PASSWORD: pgadmin
          POSTGRES_DB: consequent
        ports:
          - 5431:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # actions/setup-node's registry-url input writes an _authToken line
      # to .npmrc even with no NODE_AUTH_TOKEN secret set; npm then sees
      # "auth is configured" and skips the OIDC exchange entirely, sending
      # an empty token instead (npm/documentation#1960,
      # actions/setup-node#1551). Omitting registry-url avoids that --
      # registry.npmjs.org is npm's default registry.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm publish
